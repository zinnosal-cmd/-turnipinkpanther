<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Panther - Gestione Turni Personale</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --card-border: #222222;
            --accent-pink: #e65c9c;
            --text-main: #ffffff;
            --text-secondary: #999999;
            --green-wa: #25d366;
            --red-riposo: #ff4d4d;
            --table-header-bg: #1f1418;
            --table-border: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            color: var(--accent-pink);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .admin-toggle-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .controls-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 140px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: bold;
        }

        select, input {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-pink);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            width: 100%;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-pink { background-color: var(--accent-pink); color: #fff; }
        .btn-green { background-color: var(--green-wa); color: #fff; }
        .btn-secondary { background-color: #262626; color: #fff; border: 1px solid #333; }
        .btn-blue { background-color: #007bff; color: #fff; }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            border: 1px solid var(--table-border);
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: var(--table-header-bg);
            color: var(--accent-pink);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td.emp-name {
            font-weight: bold;
            text-align: left;
            background-color: #161616;
            min-width: 130px;
        }

        .shift-cell {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .time-inputs {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .time-inputs input {
            padding: 4px;
            font-size: 0.75rem;
            width: 55px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid var(--accent-pink);
        }

        .badge-draft {
            background: #ff9800;
            color: #000;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
        }

        .badge-published {
            background: #4caf50;
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
        }

        .del-emp-btn {
            background: none;
            border: none;
            color: var(--red-riposo);
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        @media print {
            body { background-color: #fff; color: #000; padding: 0; }
            .controls-card, .action-buttons, .admin-toggle-btn, .del-emp-btn, select, input { display: none !important; }
            .table-wrapper { border: none; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #000; color: #000; background: none !important; }
            th { color: #000; font-weight: bold; }
            .print-only-cell { display: block !important; }
        }
    </style>

    <!-- Firebase App & Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>Pink Panther</h1>
        <p class="subtitle">Gestione Turni Personale <span id="statusBadge"></span></p>
        <button class="admin-toggle-btn" id="adminBtn" onclick="toggleAdmin()">Gestione Manager</button>
    </header>

    <div class="controls-card">
        <div class="control-group">
            <label>Anno</label>
            <select id="yearSelect" onchange="onDateFilterChange()"></select>
        </div>
        <div class="control-group">
            <label>Mese</label>
            <select id="monthSelect" onchange="onDateFilterChange()"></select>
        </div>
        <div class="control-group">
            <label>Settimana Reale</label>
            <select id="weekSelect" onchange="loadCurrentWeekData()"></select>
        </div>
        <div class="control-group">
            <label>Cerca Dipendente</label>
            <input type="text" id="searchEmp" placeholder="Es. Salvatore..." oninput="filterEmployees()">
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-pink admin-only" onclick="addEmployee()" style="display:none;">+ Aggiungi Dipendente</button>
        <button class="btn btn-green admin-only" id="publishBtn" onclick="publishShifts()" style="display:none;">🚀 Pubblica Turni</button>
        <button class="btn btn-secondary" onclick="shareWhatsApp()">Invia su WhatsApp</button>
        <button class="btn btn-secondary" onclick="window.print()">Stampa / PDF</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="tableHeader">
                    <th>DIPENDENTE</th>
                    <!-- Giorni generati dinamicamente -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Righe generate dinamicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Configurazione Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForSecurityReasonOnly",
        authDomain: "bar-pink-panther.firebaseapp.com",
        projectId: "bar-pink-panther",
        storageBucket: "bar-pink-panther.appspot.com",
        messagingSenderId: "1234567890",
        appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let isAdmin = false;
    let currentShifts = {};
    let employeesList = ["Salvatore", "Marco", "Gennaro", "Titti", "Maria", "Mirko", "Francesca", "Raffaela"];
    let unsubscribeDrafts = null;
    let unsubscribePublic = null;

    const daysNames = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
    const shiftOptions = ["-", "Mattina", "Pomeriggio", "Sera", "Spezzato", "Riposo", "Orario"];

    window.onload = function() {
        initYearAndMonths();
        renderTableHeader();
        loadCurrentWeekData();
    };

    function toggleAdmin() {
        if (!isAdmin) {
            let pin = prompt("Inserisci il PIN Manager:");
            if (pin === "1818") {
                isAdmin = true;
                document.getElementById("adminBtn").innerText = "Uscita Manager";
                document.querySelectorAll(".admin-only").forEach(el => el.style.display = "inline-flex");
                alert("Modalità Manager Attivata!");
                loadCurrentWeekData();
            } else if (pin !== null) {
                alert("PIN Errato!");
            }
        } else {
            isAdmin = false;
            document.getElementById("adminBtn").innerText = "Gestione Manager";
            document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
            loadCurrentWeekData();
        }
    }

    function initYearAndMonths() {
        const ySelect = document.getElementById("yearSelect");
        const mSelect = document.getElementById("monthSelect");
        const now = new Date();
        const curYear = now.getFullYear();

        ySelect.innerHTML = `<option value="${curYear}">${curYear}</option><option value="${curYear+1}">${curYear+1}</option>`;
        
        const months = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
        mSelect.innerHTML = months.map((m, idx) => `<option value="${idx}" ${idx === now.getMonth() ? 'selected' : ''}>${m}</option>`).join('');

        updateWeekOptions();
    }

    function onDateFilterChange() {
        updateWeekOptions();
        loadCurrentWeekData();
    }

    function updateWeekOptions() {
        const year = parseInt(document.getElementById("yearSelect").value);
        const month = parseInt(document.getElementById("monthSelect").value);
        const wSelect = document.getElementById("weekSelect");
        
        wSelect.innerHTML = "";
        
        // Trova i lunedì del mese
        let date = new Date(year, month, 1);
        let mondays = [];

        while (date.getMonth() === month) {
            if (date.getDay() === 1) { // 1 = Lunedì
                mondays.push(new Date(date));
            }
            date.setDate(date.getDate() + 1);
        }

        // Se il mese non inizia di lunedì, prendiamo il lunedì precedente per coprire la prima settimana
        if (mondays.length === 0 || mondays[0].getDate() > 1) {
            let firstDay = new Date(year, month, 1);
            let dayOfWeek = firstDay.getDay();
            let diff = firstDay.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            let prevMonday = new Date(firstDay.setDate(diff));
            mondays.unshift(prevMonday);
        }

        mondays.forEach((mon) => {
            let sun = new Date(mon);
            sun.setDate(mon.getDate() + 6);
            
            let label = `Dal ${mon.getDate()} ${getShortMonth(mon.getMonth())} al ${sun.getDate()} ${getShortMonth(sun.getMonth())}`;
            let docId = `${mon.getFullYear()}_W${getWeekNumber(mon)}`;
            
            let opt = document.createElement("option");
            opt.value = docId;
            opt.innerText = label;
            opt.dataset.monday = mon.toISOString();
            wSelect.appendChild(opt);
        });
    }

    function getShortMonth(mIdx) {
        return ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"][mIdx];
    }

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
        return weekNo;
    }

    function renderTableHeader() {
        const wSelect = document.getElementById("weekSelect");
        const headerTr = document.getElementById("tableHeader");
        headerTr.innerHTML = '<th>DIPENDENTE</th>';

        if (!wSelect.selectedOptions.length) return;
        
        let monStr = wSelect.selectedOptions[0].dataset.monday;
        let mon = monStr ? new Date(monStr) : new Date();

        for (let i = 0; i < 7; i++) {
            let cur = new Date(mon);
            cur.setDate(mon.getDate() + i);
            headerTr.innerHTML += `<th>${daysNames[i].toUpperCase()}<br><small style="font-size:0.7rem; color:#fff;">${cur.getDate()} ${getShortMonth(cur.getMonth()).toUpperCase()}</small></th>`;
        }
    }

    function loadCurrentWeekData() {
        renderTableHeader();
        const docId = document.getElementById("weekSelect").value;
        const statusBadge = document.getElementById("statusBadge");

        if (unsubscribeDrafts) unsubscribeDrafts();
        if (unsubscribePublic) unsubscribePublic();

        if (isAdmin) {
            // Modalità Manager: Ascolta DRAFTS
            unsubscribeDrafts = db.collection("shiftsData_drafts").doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    currentShifts = doc.data().shifts || {};
                    statusBadge.innerHTML = '<span class="badge-draft">BOZZA (Manager)</span>';
                } else {
                    currentShifts = {};
                    statusBadge.innerHTML = '<span class="badge-draft">NUOVA BOZZA</span>';
                }
                renderTable();
            });
        } else {
            // Modalità Dipendente: Ascolta PUBLIC
            unsubscribePublic = db.collection("shiftsData").doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    currentShifts = doc.data().shifts || {};
                    statusBadge.innerHTML = '<span class="badge-published">PUBBLICATO</span>';
                } else {
                    currentShifts = {};
                    statusBadge.innerHTML = '<span style="color:#888; font-size:0.8rem;">(Non ancora pubblicato)</span>';
                }
                renderTable();
            });
        }
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        employeesList.forEach(emp => {
            let tr = document.createElement("tr");
            tr.className = "emp-row";
            tr.dataset.name = emp.toLowerCase();

            let tdName = `<td class="emp-name">${emp} ${isAdmin ? `<button class="del-emp-btn" onclick="removeEmployee('${emp}')">(X)</button>` : ''}</td>`;
            tr.innerHTML += tdName;

            for (let i = 0; i < 7; i++) {
                let cellData = (currentShifts[emp] && currentShifts[emp][i]) ? currentShifts[emp][i] : { type: "-", start: "", end: "" };
                
                let tdContent = "";
                if (isAdmin) {
                    tdContent = `<div class="shift-cell">
                        <select onchange="updateShift('${emp}', ${i}, 'type', this.value)">
                            ${shiftOptions.map(opt => `<option value="${opt}" ${cellData.type === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                        ${cellData.type === 'Orario' ? `
                            <div class="time-inputs">
                                <input type="time" value="${cellData.start || ''}" onchange="updateShift('${emp}',${i}, 'start', this.value)">
                                <input type="time" value="${cellData.end || ''}" onchange="updateShift('${emp}',${i}, 'end', this.value)">
                            </div>
                        ` : ''}
                    </div>`;
                } else {
                    let displayTxt = cellData.type;
                    if (cellData.type === 'Orario' && cellData.start && cellData.end) {
                        displayTxt = `${cellData.start} - ${cellData.end}`;
                    }
                    let color = cellData.type === 'Riposo' ? 'color: var(--red-riposo); font-weight:bold;' : '';
                    tdContent = `<span style="${color}">${displayTxt}</span>`;
                }
                tr.innerHTML += `<td>${tdContent}</td>`;
            }
            tbody.appendChild(tr);
        });
    }

    function updateShift(emp, dayIdx, field, value) {
        if (!currentShifts[emp]) currentShifts[emp] = {};
        if (!currentShifts[emp][dayIdx]) currentShifts[emp][dayIdx] = { type: "-", start: "", end: "" };

        currentShifts[emp][dayIdx][field] = value;

        const docId = document.getElementById("weekSelect").value;
        db.collection("shiftsData_drafts").doc(docId).set({
            shifts: currentShifts,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
    }

    function publishShifts() {
        const docId = document.getElementById("weekSelect").value;
        if (!confirm("Vuoi pubblicare i turni di questa settimana per tutti i dipendenti?")) return;

        db.collection("shiftsData").doc(docId).set({
            shifts: currentShifts,
            publishedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("Turni Pubblicati con successo!");
        }).catch(err => {
            alert("Errore nella pubblicazione: " + err.message);
        });
    }

    function addEmployee() {
        let name = prompt("Nome nuovo dipendente:");
        if (name && !employeesList.includes(name)) {
            employeesList.push(name);
            renderTable();
        }
    }

    function removeEmployee(name) {
        if (confirm(`Eliminare ${name}?`)) {
            employeesList = employeesList.filter(e => e !== name);
            renderTable();
        }
    }

    function filterEmployees() {
        let q = document.getElementById("searchEmp").value.toLowerCase();
        document.querySelectorAll(".emp-row").forEach(row => {
            row.style.display = row.dataset.name.includes(q) ? "" : "none";
        });
    }

    function shareWhatsApp() {
        let txt = "*TURNI PINK PANTHER*\n\n";
        let wSelect = document.getElementById("weekSelect");
        txt += `*Settimana:* ${wSelect.options[wSelect.selectedIndex].text}\n\n`;

        employeesList.forEach(emp => {
            txt += `*${emp}:*\n`;
            for (let i = 0; i < 7; i++) {
                let cell = (currentShifts[emp] && currentShifts[emp][i]) ? currentShifts[emp][i] : { type: "-" };
                let t = cell.type;
                if (t === 'Orario' && cell.start) t = `${cell.start}-${cell.end}`;
                txt += `  ${daysNames[i].slice(0,3)}: ${t}\n`;
            }
            txt += "\n";
        });

        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`, '_blank');
    }
</script>

</body>
</html>
